name: Build & test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Self-tests (real Rapier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset).

      - name: Install dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/icon-$d.png $RES/mipmap-$d/ic_launcher.png
            cp resources/icon-$d.png $RES/mipmap-$d/ic_launcher_round.png
            cp resources/icon-$d.png $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FatalZero.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FatalZero-apk
          path: FatalZero.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fatal Zero build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}. Download FatalZero.apk below and install it on Android (allow installs from unknown sources).
          files: FatalZero.apk
